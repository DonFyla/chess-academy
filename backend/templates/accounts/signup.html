{% extends "base.html" %}

{% block title %}Signup - Moving Train Chess Academy{% endblock %}

{% block content %}
<section class="container mx-auto px-6 py-16 max-w-md">
    <h1 class="text-3xl font-semibold mb-6 text-center">Signup</h1>
    <form method="post" class="bg-white rounded-2xl shadow-lg p-8 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full px-4 py-3 bg-[#5E5044] text-white rounded-full hover:bg-[#4a3f35]">
            Signup
        </button>
    </form>
</section>
{% endblock %}
